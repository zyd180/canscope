name: CANScope CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canscope-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate smoke test data
        shell: pwsh
        run: |
          python scripts/make_test_data.py
          if (!(Test-Path -LiteralPath "${{ github.workspace }}\data\test.blf")) { throw "test.blf 未生成" }
          if (!(Test-Path -LiteralPath "${{ github.workspace }}\data\test.dbc")) { throw "test.dbc 未生成" }
          Get-Item "${{ github.workspace }}\data\test.blf", "${{ github.workspace }}\data\test.dbc"
      - name: Compatibility check
        run: python scripts/compat_check.py
      - name: Core smoke tests
        timeout-minutes: 5
        run: python tests/smoke_core.py
      - name: Sync smoke tests
        timeout-minutes: 5
        run: python tests/smoke_sync.py
      - name: GUI smoke tests
        timeout-minutes: 5
        run: python tests/smoke_gui.py
      - name: M3 smoke tests
        timeout-minutes: 5
        run: python tests/smoke_m3.py
      - name: M4 smoke tests
        timeout-minutes: 5
        run: python tests/smoke_m4.py
      - name: M5 smoke tests
        timeout-minutes: 5
        run: python tests/smoke_m5.py
      - name: Scope operations smoke tests
        timeout-minutes: 5
        run: python tests/smoke_scope_ops.py
      - name: R1 smoke tests
        timeout-minutes: 5
        run: python tests/smoke_r1.py
      - name: R2 smoke tests
        timeout-minutes: 5
        run: python tests/smoke_r2.py
      - name: R3 smoke tests
        timeout-minutes: 5
        run: python tests/smoke_r3.py

  package:
    name: Package Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Verify package files
        run: python scripts/verify_package.py dist/CANScope
      - name: Run packaged smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\dist\CANScope\CANScope.exe --smoke
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = python -c "from version import VERSION; print(VERSION)"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - name: Create version tag
        id: tag
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          git fetch --tags origin
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0 -and $existing) {
            "release=false" >> $env:GITHUB_OUTPUT
            Write-Host "Tag $tag 已存在,不重复发布"
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag $tag
            git push origin $tag
            "release=true" >> $env:GITHUB_OUTPUT
            Write-Host "已创建并推送 $tag"
          }
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: CANScope-${{ github.sha }}
          path: dist/CANScope
      - name: Create release archive
        if: steps.tag.outputs.release == 'true' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path dist/CANScope -DestinationPath CANScope-${{ steps.version.outputs.tag }}.zip
      - name: Publish GitHub Release
        if: steps.tag.outputs.release == 'true' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: CANScope-${{ steps.version.outputs.tag }}.zip
