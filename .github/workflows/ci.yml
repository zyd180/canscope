name: CANScope CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canscope-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compatibility check
        run: python scripts/compat_check.py
      - name: Core smoke tests
        timeout-minutes: 5
        run: python tests/smoke_core.py
      - name: Sync smoke tests
        timeout-minutes: 5
        run: python tests/smoke_sync.py
      - name: GUI smoke tests
        timeout-minutes: 5
        run: python tests/smoke_gui.py
      - name: M3 smoke tests
        timeout-minutes: 5
        run: python tests/smoke_m3.py
      - name: M4 smoke tests
        timeout-minutes: 5
        run: python tests/smoke_m4.py
      - name: M5 smoke tests
        timeout-minutes: 5
        run: python tests/smoke_m5.py
      - name: Scope operations smoke tests
        timeout-minutes: 5
        run: python tests/smoke_scope_ops.py
      - name: R1 smoke tests
        timeout-minutes: 5
        run: python tests/smoke_r1.py
      - name: R2 smoke tests
        timeout-minutes: 5
        run: python tests/smoke_r2.py
      - name: R3 smoke tests
        timeout-minutes: 5
        run: python tests/smoke_r3.py

  package:
    name: Package Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Verify package files
        run: python scripts/verify_package.py dist/CANScope
      - name: Run packaged smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\dist\CANScope\CANScope.exe --smoke
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: CANScope-${{ github.sha }}
          path: dist/CANScope
      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path dist/CANScope -DestinationPath CANScope-${{ github.ref_name }}.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CANScope-${{ github.ref_name }}.zip
